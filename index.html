<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint under the notch and home indicator;
         the safe-area-inset padding in index.css is what keeps content clear of them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Eagle Gym — سجّل تمارينك وتابع تقدمك. يعمل بدون إنترنت." />
    <meta name="theme-color" content="#0d0d0d" />

    <!-- iOS standalone mode. Without apple-mobile-web-app-capable, tapping the
         Home Screen icon opens Safari with full browser chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eagle Gym" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS uses this link for the Home Screen icon and ignores the manifest icons.
         It must be 180x180 and fully opaque — iOS renders alpha as black. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />

    <title>Eagle Gym</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
