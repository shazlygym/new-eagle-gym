server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The app is a static, offline-first PWA — there is no backend to proxy to.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the shell or the service worker, otherwise a deployed update
    # stays invisible until the browser happens to revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type "application/manifest+json";
    }

    # Vite emits content-hashed asset filenames, so these are safe to pin forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
